spring:
  application:
    name: myblog
  config:
    # 저장소 루트의 .env(비밀 값)를 읽는다. 없으면 환경 변수만 쓴다.
    import: optional:file:../.env[.properties],optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/myblog}
    username: ${DB_USERNAME:myblog}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false

server:
  servlet:
    session:
      timeout: ${myblog.session.timeout}
      cookie:
        name: ${myblog.session.cookie-name}
        http-only: true
        same-site: lax
        secure: ${myblog.session.secure-cookie}
        max-age: ${myblog.session.timeout}
  error:
    include-message: never
    include-stacktrace: never

# 바꿀 수 있는 기본값 (NF-08). 원본 각 파일의 '기본값' 표와 같다.
myblog:
  member:
    nickname-min: 2
    nickname-max: 10
    password-min: 8
    password-max: 64
    password-specials: "!@#$%^&*()_+-="
    bio-max: 100
    withdraw-keep: 30d   # 탈퇴 후 복구할 수 있는 기간. 지나면 블로그·글을 지우고 개인정보를 익명화한다
  verification:
    code-ttl: 10m
    resend-interval: 1m
    daily-limit: 5
    max-attempts: 5
    verified-ttl: 30m
  login:
    max-failures: 5
    lock-duration: 10m
  session:
    timeout: 7d
    cookie-name: MYBLOG_SESSION
    secure-cookie: ${SESSION_SECURE_COOKIE:false}
  blog:
    name-max: 30
    description-max: 200
    about-max: 5000
    category-name-max: 20
    category-description-max: 100   # 다이어리 소개
    blog-tags: 12                    # 블로그 화면 왼쪽 태그 모음 개수
    default-topic: hobby
    default-category-name: 미분류
    color-count: 8
  draft:
    max-per-member: 20       # 임시저장 글은 회원별 20개까지
    autosave-interval: 60s   # 글쓰기 중 바뀐 게 있으면 60초마다 자동 임시저장 (0s면 끔)
  post:
    title-max: 100
    body-max: 10000
    excerpt-length: 100
    page-size: 10
    other-posts: 3
    pin-limit: 3   # 블로그 대표글 최대 개수
  comment:
    body-max: 500
    cooldown: 5s
    preview-length: 50
  tag:
    max-per-post: 5
    max-length: 15
  report:
    detail-max: 200
  image:
    max-bytes: 5242880
    max-per-post: 10
    storage: ${MYBLOG_IMAGE_STORAGE:disk}
    disk-path: ${MYBLOG_IMAGE_DISK_PATH:./data/images}
    orphan-ttl: 24h
    s3:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      region: us-east-1
      bucket: ${MINIO_BUCKET:myblog-images}
      access-key: ${MINIO_USER:minioadmin}
      secret-key: ${MINIO_PASSWORD:}
  search:
    min-length: 2
    max-length: 50
    log-retention: 30d
  views:
    dedup: 30m
  trending:
    size: 10
    interval: 5s
    window: 1h
    search-weight: 3
    view-weight: 1
    comment-weight: 5
  home:
    featured: 3
    latest: 6
    popular-days: 7
    topic-posts: 9
    blogs: 6
  dashboard:
    popular-days: 7
    popular-size: 5
    recent-size: 5
    chart-days: 30
  mail:
    mode: ${MYBLOG_MAIL_MODE:log}
    from: ${MAIL_FROM:no-reply@myblog.local}
    service-name: 사각
