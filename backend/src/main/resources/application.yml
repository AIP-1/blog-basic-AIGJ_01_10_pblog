spring:
  application:
    name: myblog
  config:
    # 저장소 루트의 .env(비밀 값)를 읽는다. 없으면 환경 변수만 쓴다.
    import: optional:file:../.env[.properties],optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/myblog}
    username: ${DB_USERNAME:myblog}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
  session:
    # 로그인 세션을 Redis에 둔다. 서버를 새로 띄워도(배포) 로그인이 유지되고, 두 서버가 같은 세션을 본다.
    # indexed: 회원별 세션 목록을 Redis가 들고 있어 비밀번호 변경·탈퇴 때 다른 기기 로그인을 끊을 수 있다.
    redis:
      repository-type: indexed
      namespace: myblog:session
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false

server:
  # 배포 때 꺼질 서버는 하던 요청을 끝내고 내려간다 (무중단 배포)
  shutdown: graceful
  servlet:
    session:
      timeout: ${myblog.session.timeout}
      cookie:
        name: ${myblog.session.cookie-name}
        http-only: true
        same-site: lax
        secure: ${myblog.session.secure-cookie}
        max-age: ${myblog.session.timeout}
  error:
    include-message: never
    include-stacktrace: never

# 바꿀 수 있는 기본값 (NF-08). 원본 각 파일의 '기본값' 표와 같다.
myblog:
  member:
    nickname-min: 2
    nickname-max: 10
    password-min: 8
    password-max: 64
    password-specials: "!@#$%^&*()_+-="
    bio-max: 100
    withdraw-keep: 30d   # 탈퇴 후 복구할 수 있는 기간. 지나면 블로그·글을 지우고 개인정보를 익명화한다
  verification:
    code-ttl: 10m
    resend-interval: 1m
    daily-limit: 5
    max-attempts: 5
    verified-ttl: 30m
  login:
    max-failures: 5
    lock-duration: 10m
  session:
    timeout: 7d
    cookie-name: MYBLOG_SESSION
    secure-cookie: ${SESSION_SECURE_COOKIE:false}
  blog:
    name-max: 30
    description-max: 200
    about-max: 5000
    category-name-max: 20
    category-description-max: 100   # 다이어리 소개
    blog-tags: 12                    # 블로그 화면 왼쪽 태그 모음 개수
    default-topic: hobby
    default-category-name: 일기장
    color-count: 8
  draft:
    max-per-member: 20       # 임시저장 글은 회원별 20개까지
    autosave-interval: 60s   # 글쓰기 중 바뀐 게 있으면 60초마다 자동 임시저장 (0s면 끔)
  post:
    title-max: 100
    body-max: 10000
    excerpt-length: 100
    page-size: 10
    other-posts: 3
    pin-limit: 3   # 블로그 대표글 최대 개수
  comment:
    body-max: 500
    cooldown: 5s
    preview-length: 50
  tag:
    max-per-post: 5
    max-length: 15
  report:
    detail-max: 200
  image:
    max-bytes: 5242880
    max-per-post: 10
    storage: ${MYBLOG_IMAGE_STORAGE:disk}
    disk-path: ${MYBLOG_IMAGE_DISK_PATH:./data/images}
    orphan-ttl: 24h
    s3:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      region: us-east-1
      bucket: ${MINIO_BUCKET:myblog-images}
      access-key: ${MINIO_USER:minioadmin}
      secret-key: ${MINIO_PASSWORD:}
  search:
    min-length: 2
    max-length: 50
    log-retention: 30d
  views:
    dedup: 30m
  trending:
    size: 10
    interval: 5s
    window: 24h
    search-weight: 3
    view-weight: 1
    comment-weight: 5
  home:
    featured: 3
    latest: 6
    popular-days: 7
    topic-posts: 9
    blogs: 6
    notices: 3            # 메인 공지 띠에 보여 줄 공지 개수
    weekly-popular: 6     # 메인 '이번 주 인기 글' 개수 (popular-days 안에 올라온 글)
    popular-diaries: 5    # 메인 '인기 다이어리' 개수
    recommend-pool: 30    # 추천 글 후보(전체 인기 글) 개수 — 브라우저의 읽은 기록으로 고른다
  notice:
    owner-email: ${NOTICE_OWNER_EMAIL:}   # 공지를 쓰는 회원의 이메일. 비우면 공지사항이 비어 있다
    category-name: 공지                    # 그 회원 블로그에서 공지로 쓰는 다이어리 이름
  shop:
    checkin-ink: 10          # 하루 첫 출석 (한국 시간 자정에 바뀐다)
    post-ink: 20             # 공개 글을 새로 올리면 (수정은 해당 없음, 지워도 한도에 남는다)
    post-daily-max: 3        # 글로 받는 잉크는 하루 3번까지
    comment-ink: 2           # 다른 사람 글에 댓글을 달면
    comment-daily-max: 10    # 댓글로 받는 잉크는 하루 10번까지
    stickers-per-diary: 3    # 다이어리 표지에 붙일 수 있는 스티커 수
    history-size: 20         # 상점 화면의 잉크 내역 개수
  dashboard:
    popular-days: 7
    popular-size: 5
    recent-size: 5
    chart-days: 30
  oauth:
    # 소셜 로그인. client-id가 비어 있는 제공자는 켜지 않는다 (둘 다 비면 소셜 로그인 버튼이 안 보인다)
    redirect-base: ${SITE_URL:{baseUrl}}   # 돌아올 주소 = <redirect-base>/login/oauth2/code/{kakao|google}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
  mail:
    mode: ${MYBLOG_MAIL_MODE:log}
    from: ${MAIL_FROM:no-reply@myblog.local}
    service-name: 사각
