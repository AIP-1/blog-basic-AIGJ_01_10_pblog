spring:
  # 대부분의 테스트는 MockHttpSession으로 로그인을 들고 다닌다. Redis 세션은 RedisSessionIT에서 따로 본다.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/myblog_test}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  data:
    redis:
      database: 1
myblog:
  image:
    storage: disk
    disk-path: build/test-images
  mail:
    mode: log
logging:
  level:
    com.myblog.mail: warn
