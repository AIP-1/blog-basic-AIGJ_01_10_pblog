# CHANGELOG.md의 버전 중 아직 GitHub Release가 없는 것을 만든다.
name: release
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create missing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import re, subprocess
          text = open("CHANGELOG.md", encoding="utf-8").read()
          parts = re.split(r"^## (v\d+\.\d+\.\d+)[ \t]*(.*)$", text, flags=re.M)
          entries = [(parts[i], parts[i + 1].strip(), parts[i + 2]) for i in range(1, len(parts), 3)]
          existing = set(subprocess.run(["gh", "release", "list", "--limit", "200", "--json", "tagName", "-q", ".[].tagName"],
                                        capture_output=True, text=True, check=True).stdout.split())
          latest = entries[0][0] if entries else None
          for tag, title, body in reversed(entries):  # 오래된 것부터 만들어 최신이 latest가 되게
              if tag in existing:
                  continue
              m = re.search(r"<!--\s*commit:\s*([0-9a-f]+)\s*-->", body)
              target = subprocess.run(["git", "rev-parse", m.group(1) if m else "HEAD"],
                                      capture_output=True, text=True, check=True).stdout.strip()
              notes = re.sub(r"<!--.*?-->\n?", "", body).strip().replace("\n### ", "\n## ")
              if notes.startswith("### "):
                  notes = notes[1:]
              open("notes.md", "w", encoding="utf-8").write(notes + "\n")
              name = f"{tag} {title}".strip()
              subprocess.run(["gh", "release", "create", tag, "--target", target, "--title", name, "--notes-file", "notes.md",
                              "--latest=" + ("true" if tag == latest else "false")], check=True)
              print("created", tag, target)
          PY
