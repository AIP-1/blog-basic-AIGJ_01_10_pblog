name: ci

on:
  pull_request:
  workflow_call: # main에 들어오면 deploy.yml이 이 검사를 먼저 돌린다

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myblog_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube가 새로 바뀐 코드를 구분하려면 전체 기록이 필요하다
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew test
        env:
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
      # 품질 게이트: 새 코드의 버그 · 보안 취약점 · 중복 · 커버리지 기준을 넘지 못하면 CI가 실패한다.
      # SONAR_TOKEN 시크릿이 없으면(포크 PR 등) 건너뛴다.
      # 화면 코드 커버리지(frontend/coverage/lcov.info)도 같은 분석에 넣는다
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: env.SONAR_TOKEN != ''
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 화면 테스트 커버리지
        if: env.SONAR_TOKEN != ''
        working-directory: frontend
        run: npm ci && npm run test:coverage
      - name: SonarQube 분석과 품질 게이트
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        with:
          projectBaseDir: .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
