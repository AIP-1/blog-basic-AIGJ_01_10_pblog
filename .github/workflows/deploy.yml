name: deploy

# main에 푸시되거나 PR이 합쳐지면 검사를 돌리고, 통과하면 서버에 배포한다.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit # 품질 게이트에 SONAR_TOKEN을 넘긴다

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t myblog:${{ github.sha }} .
          docker save myblog:${{ github.sha }} | gzip > myblog-image.tar.gz

      - name: Upload image and script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_ADDRESS }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: myblog-image.tar.gz,deploy/deploy.sh
          target: myblog-deploy
          overwrite: true

      - name: Run deploy script on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_ADDRESS: ${{ secrets.DB_ADDRESS }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SCHEMA: ${{ secrets.DB_SCHEMA }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          IMAGE_TAG: ${{ github.sha }}
          # 공지사항을 쓰는 회원 이메일 (저장소 변수, 선택)
          NOTICE_OWNER_EMAIL: ${{ vars.NOTICE_OWNER_EMAIL }}
          # 메일 서버 (저장소 시크릿, 선택). SMTP_HOST가 비어 있으면 메일을 보내지 않는다
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          # 사이트 주소 (저장소 변수, 선택. 기본 https://sagak.java21.net). 소셜 로그인 뒤 돌아올 주소에 쓴다
          SITE_URL: ${{ vars.SITE_URL }}
          # 소셜 로그인 (저장소 시크릿, 선택). CLIENT_ID가 비어 있는 제공자는 켜지지 않는다
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        with:
          host: ${{ secrets.SSH_ADDRESS }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: DB_ADDRESS,DB_PORT,DB_NAME,DB_SCHEMA,DB_USERNAME,DB_PASSWORD,IMAGE_TAG,NOTICE_OWNER_EMAIL,SMTP_HOST,SMTP_PORT,SMTP_USERNAME,SMTP_PASSWORD,MAIL_FROM,SITE_URL,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET
          command_timeout: 15m
          script: |
            set -e
            cd ~/myblog-deploy
            chmod +x deploy/deploy.sh
            ./deploy/deploy.sh ~/myblog-deploy/myblog-image.tar.gz "$IMAGE_TAG"
            rm -f ~/myblog-deploy/myblog-image.tar.gz

      # 스모크 테스트: 배포가 끝난 뒤 실제 주소(HTTPS)로 메인 화면과 API가 열리는지 확인한다.
      # 서버 안 확인(deploy.sh)은 통과했는데 바깥 nginx · 인증서 · 프록시에서 막히는 경우를 잡는다
      - name: 배포 후 실제 사이트 확인
        env:
          SITE: ${{ vars.SITE_URL || 'https://sagak.java21.net' }}
        run: |
          check() {
            for i in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$SITE$1" || true)
              if [ "$code" = "200" ]; then echo "OK  $1"; return 0; fi
              echo "$1 → $code, 5초 뒤 다시 ($i/5)"; sleep 5
            done
            echo "::error::$SITE$1 이 200으로 응답하지 않아요"; return 1
          }
          check /
          check /api/topics
          check /api/home
          curl -sI "$SITE/" | grep -qi '^strict-transport-security' || { echo "::error::HSTS 헤더가 없어요"; exit 1; }
