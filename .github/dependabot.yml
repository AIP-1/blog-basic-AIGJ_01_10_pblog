# 의존성 검사: 라이브러리 · 액션의 새 버전과 보안 패치를 매주 PR로 알려 준다.
# PR은 develop으로 오고, 다른 PR처럼 CI · 품질 게이트를 통과해야 머지할 수 있다.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend
    target-branch: develop
    schedule: { interval: weekly, day: monday, timezone: Asia/Seoul }
    open-pull-requests-limit: 5
    groups:
      backend-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule: { interval: weekly, day: monday, timezone: Asia/Seoul }
    open-pull-requests-limit: 5
    groups:
      frontend-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: monthly, timezone: Asia/Seoul }
    groups:
      actions:
        patterns: ["*"]
