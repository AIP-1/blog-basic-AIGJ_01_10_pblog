# SonarQube Cloud(sonarcloud.io) 분석 설정. CI의 backend 작업이 테스트 뒤에 실행한다.
sonar.host.url=https://sonarcloud.io
sonar.organization=home-my-blog
sonar.projectKey=home-my-blog_myblog
sonar.projectName=사각

sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.java.binaries=backend/build/classes/java/main
sonar.java.test.binaries=backend/build/classes/java/test
sonar.coverage.jacoco.xmlReportPaths=backend/build/reports/jacoco/test/jacocoTestReport.xml

# 품질 게이트 결과를 기다렸다가, 통과하지 못하면 CI를 실패시킨다
sonar.qualitygate.wait=true
sonar.sourceEncoding=UTF-8
